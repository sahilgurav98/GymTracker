name: Build Gym Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip GymTracker-Native-Android.zip -d extracted
          cp -r extracted/GymTrackerAndroid/* .
          cp -r extracted/GymTrackerAndroid/.[!.]* . 2>/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
